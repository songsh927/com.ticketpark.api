<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TICKETPARK</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="header">
    <div class="logo">TICKETPARK</div> <nav class="nav-links">
    <a href="#">홈</a>
    <a href="#">스포츠</a>
    <a href="#">영화</a>
    <a href="#">콘서트</a>
</nav>
    <div class="user-actions">
        <span class="search-icon">🔍</span>
        <a href="#">
            <span class="kids-profile">나의 티켓</span>
        </a>

        <a href="#">
            <span class="notification-icon">마이페이지</span>
        </a>

        <a href="/join">
            <span class="profile-icon">회원가입</span>
        </a>
    </div>
</header>

<main class="content-wrapper">

    <section class="content-section">
        <h2>영화</h2>
        <div class="poster-row">
            <div class="poster-card">
                <a href="/join">
                    <img th:src="@{/img/placeholder.png}" alt="콘텐츠 제목" class="poster-image">
                </a>
            </div>
            <div class="poster-card">
                <img th:src="@{/img/placeholder.png}" alt="콘텐츠 제목" class="poster-image">
            </div>
        </div>
    </section>

    <section class="content-section">
        <h2>콘서트</h2>
        <div class="poster-row">
            <div class="poster-card">
                <img th:src="@{/img/placeholder.png}" alt="콘텐츠 제목" class="poster-image">
            </div>
            <div class="poster-card">
                <img th:src="@{/img/placeholder.png}" alt="콘텐츠 제목" class="poster-image">
            </div>
        </div>
    </section>

    <section class="content-section top-ten-section">
        <h2>스포츠</h2>
        <div class="poster-row top-ten-row">
            <div class="top-ten-card">
                <span class="rank-number">1</span>
                <img th:src="@{/img/placeholder.png}" alt="콘텐츠 제목" class="poster-image">
            </div>
            <div class="top-ten-card">
                <span class="rank-number">2</span>
                <img th:src="@{/img/placeholder.png}" alt="콘텐츠 제목" class="poster-image">
            </div>
        </div>
    </section>

</main>

</body>
</html>
