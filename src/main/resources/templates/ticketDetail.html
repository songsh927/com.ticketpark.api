<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>티켓 예매 페이지 레이아웃</title>
    <style>
        :root {
            --primary-red: #ff3838;
            --border-color: #e0e0e0;
            --bg-gray: #f9f9f9;
        }

        body { font-family: 'Pretendard', sans-serif; margin: 0; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; border: 1px solid var(--border-color); padding: 30px; }

        /* 상단 정보 영역 */
        .info-section { display: flex; gap: 40px; margin-bottom: 40px; }
        .poster { width: 350px; flex-shrink: 0; }
        .poster img { width: 100%; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }

        .details { flex-grow: 1; }
        .badge { background: #ffeded; color: var(--primary-red); padding: 2px 8px; font-size: 12px; font-weight: bold; border-radius: 4px; }
        .title { font-size: 28px; font-weight: bold; margin: 10px 0 20px; }

        .info-table { width: 100%; border-collapse: collapse; }
        .info-table th, .info-table td { text-align: left; padding: 12px 0; border-bottom: 1px solid #eee; font-size: 14px; }
        .info-table th { width: 100px; color: #666; font-weight: normal; }
        .price-list { list-style: none; padding: 0; margin: 0; }
        .price-list li { margin-bottom: 5px; }

        /* 하단 예매 스텝 영역 */
        .booking-section { display: grid; grid-template-columns: 1fr 1fr 1fr; border: 1px solid var(--border-color); border-radius: 8px; }
        .step { padding: 20px; border-right: 1px solid var(--border-color); height: 350px; }
        .step:last-child { border-right: none; }
        .step-title { font-size: 14px; font-weight: bold; margin-bottom: 15px; color: #888; }
        .step-title span { color: var(--primary-red); margin-right: 5px; }

        /* 달력 간이 스타일 */
        .calendar-mock { text-align: center; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; font-size: 13px; }
        .day { padding: 8px; cursor: pointer; border-radius: 50%; }
        .day.selected { background: #333; color: #fff; }
        .day.sun { color: red; }
        .day.sat { color: blue; }

        /* 회차 선택 */
        .time-slot { border: 1px solid #333; padding: 10px; border-radius: 4px; display: inline-block; width: 100%; box-sizing: border-box; text-align: center; font-weight: bold; }

        /* 예매 버튼 영역 */
        .action-buttons { display: flex; justify-content: flex-end; margin-top: 20px; gap: 10px; }
        .btn { padding: 15px 40px; border-radius: 4px; border: none; font-size: 16px; font-weight: bold; cursor: pointer; }
        .btn-global { background: #fff; border: 1px solid var(--border-color); }
        .btn-reserve { background: var(--primary-red); color: #fff; flex-grow: 1; }
    </style>
</head>
<body>

<div class="container">
    <div class="info-section">
        <div class="poster">
            <img src="poster_image.jpg" alt="공연 포스터"> </div>
        <div class="details">
            <span class="badge">단독판매</span>
            <h1 class="title">2025 god CONCERT < ICONIC BOX > - 부산</h1>
            <table class="info-table">
                <tr><th>장소</th><td>부산 벡스코 제1전시장 1&2홀</td></tr>
                <tr><th>기간</th><td>2025.12.20 ~ 2025.12.21</td></tr>
                <tr><th>관람시간</th><td>150분</td></tr>
                <tr><th>가격</th><td>
                    <ul class="price-list">
                        <li>VIP석 176,000원</li>
                        <li>R석 165,000원</li>
                        <li>S석 154,000원</li>
                    </ul>
                </td></tr>
            </table>
        </div>
    </div>

    <div class="booking-section">
        <div class="step">
            <div class="step-title"><span>STEP1</span> 날짜 선택</div>
            <div class="calendar-mock">
                <strong>2025.12</strong>
                <div class="calendar-grid">
                    <span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span>
                    <div class="day sun">14</div><div>15</div><div>16</div><div>17</div><div>18</div><div>19</div><div class="day sat selected">20</div>
                    <div class="day sun">21</div><div>22</div><div>23</div><div>24</div><div>25</div><div>26</div><div class="day sat">27</div>
                </div>
            </div>
        </div>

        <div class="step">
            <div class="step-title"><span>STEP2</span> 회차 선택</div>
            <div class="time-slot">19:00</div>
        </div>

        <div class="step">
            <div class="step-title">예매가능좌석</div>
            <p style="font-size: 12px; color: #999;">잔여좌석 서비스를 제공하지 않는 공연입니다.</p>
        </div>
    </div>

    <div class="action-buttons">
        <button class="btn btn-global">GLOBAL BOOKING</button>
        <button class="btn btn-reserve">예매하기</button>
    </div>
</div>

</body>
</html>
